model:
  base_model: "Skywork/Skywork-Llama-3.1-8B"
  max_length: 16384
  use_4bit: true
  bf16: true
  fp16: false

data:
  train_file: ""
  val_file: ""
  tokenized_dir: ""
  auto_val_split_ratio: 0.1

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

output:
  config_dir: "outputs/skywork-rm-lora/configs"

train:
  rolling_dir: "outputs/skywork-rm-lora/rolling"
  checkpoint_dir: "outputs/skywork-rm-lora/checkpoints"
  final_dir: "outputs/skywork-rm-lora/final"
  num_train_epochs: 5
  learning_rate: 1.0e-5
  weight_decay: 0.0
  warmup_ratio: 0.03
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 16
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 3
  gradient_checkpointing: false
  seed: 42
  report_to: "wandb"
  run_name: "skywork-rm-lora-v1"
  resume_if_possible: true

wandb:
  project: 
  entity: 
